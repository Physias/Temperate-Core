name: Release Temperate Core - GitHub

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: temperate-github-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Validate release version and notes
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Expected a version tag like v1.0.3; received '$GITHUB_REF_NAME'." >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          if [[ ! -f RELEASE_NOTES.md ]] || ! grep -Fq "Temperate Core $VERSION" RELEASE_NOTES.md; then
            echo "RELEASE_NOTES.md must describe Temperate Core $VERSION." >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists. Refusing to overwrite it." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build distribution JAR
        run: bash ./gradlew clean build --no-daemon

      - name: Validate JAR and generate SHA-256
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          version = os.environ['RELEASE_VERSION']
          jar = Path(f'build/libs/temperate_core-{version}.jar')
          if not jar.is_file():
              raise SystemExit(f'Missing distribution JAR: {jar}')
          with zipfile.ZipFile(jar) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Invalid JAR ZIP contents')
              metadata = json.loads(archive.read('fabric.mod.json'))
          if metadata.get('id') != 'temperate_core' or metadata.get('version') != version:
              raise SystemExit(f'Invalid mod metadata: {metadata.get("id")} {metadata.get("version")}')
          sha256 = hashlib.sha256(jar.read_bytes()).hexdigest()
          checksum = jar.with_suffix(jar.suffix + '.sha256')
          checksum.write_text(f'{sha256}  {jar.name}\n', encoding='utf-8')
          print(f'Validated {jar} | SHA256 {sha256}')
          PY

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          JAR="build/libs/temperate_core-${RELEASE_VERSION}.jar"
          gh release create "$GITHUB_REF_NAME" \
            "$JAR" "$JAR.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Temperate Core ${RELEASE_VERSION} - Minecraft 26.3" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
