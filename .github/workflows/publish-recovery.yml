name: Recover Temperate Core 1.0.2 distribution

on:
  workflow_dispatch:
    inputs:
      destination:
        description: 'Upload only if version 1.0.2 does not already exist on this platform'
        required: true
        type: choice
        options:
          - modrinth
          - curseforge

permissions:
  contents: read

jobs:
  recover:
    name: Publish 1.0.2 to selected platform
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published tag for release notes
        uses: actions/checkout@v7
        with:
          ref: v1.0.2

      - name: Download the exact GitHub Release JAR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download v1.0.2 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'temperate_core-1.0.2.jar' \
            --dir release

      - name: Verify downloaded JAR
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          jar = Path('release/temperate_core-1.0.2.jar')
          if not jar.is_file():
              raise SystemExit(f'Missing GitHub Release asset: {jar}')
          with zipfile.ZipFile(jar) as archive:
              metadata = json.loads(archive.read('fabric.mod.json'))
              if archive.testzip() is not None:
                  raise SystemExit('Corrupt JAR archive')
          if metadata.get('id') != 'temperate_core' or metadata.get('version') != '1.0.2':
              raise SystemExit(f'Incorrect mod ID/version in {jar}: {metadata}')
          print(f'Validated {jar} | SHA256 {hashlib.sha256(jar.read_bytes()).hexdigest()}')
          PY

      - name: Check chosen platform configuration
        shell: bash
        env:
          DESTINATION: ${{ inputs.destination }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          case "$DESTINATION" in
            modrinth)
              test -n "$MODRINTH_PROJECT_ID" && test -n "$MODRINTH_TOKEN" || { echo 'Missing Modrinth configuration'; exit 1; }
              ;;
            curseforge)
              test -n "$CURSEFORGE_PROJECT_ID" && test -n "$CURSEFORGE_TOKEN" || { echo 'Missing CurseForge configuration'; exit 1; }
              ;;
            *) echo "Invalid destination: $DESTINATION"; exit 1 ;;
          esac

      - name: Publish to Modrinth only
        if: ${{ inputs.destination == 'modrinth' }}
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: false
          modrinth-unfeature-mode: none
          files: release/temperate_core-1.0.2.jar
          name: Temperate Core 1.0.2 — Minecraft 26.3
          version: 1.0.2
          version-type: release
          changelog-file: RELEASE_NOTES.md
          loaders: fabric
          game-versions: '26.3'
          environment: client | server
          java: '25'
          dependencies: |
            fabric(required){modrinth:P7dR8mSH}

      - name: Publish to CurseForge only
        if: ${{ inputs.destination == 'curseforge' }}
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release/temperate_core-1.0.2.jar
          name: Temperate Core 1.0.2 — Minecraft 26.3
          version: 1.0.2
          version-type: release
          changelog-file: RELEASE_NOTES.md
          loaders: fabric
          game-versions: '26.3'
          environment: client | server
          java: '25'
          dependencies: |
            fabric(required){curseforge:306612}
